#!/usr/sbin/nft -f
#
# Installed by scripts/deploy.sh to /etc/nftables.conf, replacing (not
# layering on top of) the Oracle image's own iptables ruleset - both live in
# the same netfilter core, and the image's INPUT chain ends in REJECT.
# nftables.service applies this on every boot, which is what makes it
# survive a reboot.
#
# @ADMIN_PORT@ is substituted by deploy.sh from box.env - the admin sshd
# port is kept out of the public repo, so this file ships as a template.
#
# A new connection is judged in two steps, and both have to pass - a jump
# chain rather than a flat rule list, deliberately: research 09's own
# baseline lists the ct-count cap as a *separate* rule after the rate-limit
# rule, but a source that has burned through its rate-limit burst simply
# doesn't match that rule and falls through to the ct-count rule next, which
# has no per-source awareness at all and accepts it anyway as long as global
# concurrency is under the cap. A sequential connect-and-disconnect flood
# rarely holds many connections open at once, so that ordering barely rate
# limits anything. Here, failing either check drops the packet outright
# instead of falling through to a laxer one.
flush ruleset

table inet filter {
	set app_ssh_ratelimit {
		type ipv4_addr
		timeout 60s
		flags dynamic
	}

	set admin_ssh_ratelimit {
		type ipv4_addr
		timeout 60s
		flags dynamic
	}

	chain input {
		type filter hook input priority 0; policy drop;

		iif lo accept
		ct state established,related accept
		ct state invalid drop

		icmp type { echo-request, destination-unreachable, time-exceeded } accept
		icmpv6 type { echo-request, destination-unreachable, time-exceeded, nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert } accept

		tcp dport 22 ct state new jump app_ssh_new
		tcp dport @ADMIN_PORT@ ct state new jump admin_ssh_new
	}

	# Concurrency cap first (global, matches research 09's ct-count example),
	# then the per-source-IP rate meter. Falling through either check ends in
	# the chain's own drop, not a return to a laxer rule in input.
	chain app_ssh_new {
		ct count over 200 drop
		update @app_ssh_ratelimit { ip saddr limit rate 10/minute burst 20 packets } accept
		drop
	}

	chain admin_ssh_new {
		ct count over 20 drop
		update @admin_ssh_ratelimit { ip saddr limit rate 5/minute burst 10 packets } accept
		drop
	}

	chain forward {
		type filter hook forward priority 0; policy drop;
	}

	chain output {
		type filter hook output priority 0; policy accept;
	}
}
