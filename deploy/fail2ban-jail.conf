# Written by scripts/deploy.sh (ssh-site slice 12) to
# /etc/fail2ban/jail.d/ssh-site-admin.conf.
#
# Scoped to the admin sshd only, by port. The app server on port 22 has no
# auth step to fail and writes no OpenSSH-format auth log line, so fail2ban's
# sshd filter structurally has nothing to match there - this file never
# mentions port 22, on purpose.
#
# @ADMIN_PORT@ is substituted by deploy.sh from box.env.
[sshd]
enabled = true
port = @ADMIN_PORT@
filter = sshd
logpath = %(sshd_log)s
maxretry = 5
findtime = 10m
bantime = 1h
