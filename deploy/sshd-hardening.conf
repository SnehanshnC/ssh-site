# Written by scripts/deploy.sh (ssh-site slice 12) to
# /etc/ssh/sshd_config.d/20-ssh-site-hardening.conf.
#
# Slice 11's 10-ssh-site-admin.conf already carries the Port line and moved
# sshd off 22; this only adds the rest of research 09's baseline. OpenSSH
# takes the first value it sees for a repeated keyword and the Include glob
# loads 10-* before 20-*, so Port is deliberately left out of this file
# rather than restated.
#
# @ADMIN_USER@ is substituted by deploy.sh from box.env's REMOTE_USER.
PasswordAuthentication no
PubkeyAuthentication yes
PermitRootLogin no
PermitEmptyPasswords no
MaxAuthTries 3
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 3
MaxStartups 10:30:60
PerSourceMaxStartups 3
PerSourceNetBlockSize 32:128
AllowUsers @ADMIN_USER@
